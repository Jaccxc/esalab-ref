[project]
name = "esalab"
version = "0.1.0"
description = "Reference formatter that writes citations into .docx as tracked changes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "lxml>=5.3",
    "pyjwt>=2.15.1",
    "mcp>=1.10",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esalab"]
