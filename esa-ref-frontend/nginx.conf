server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;  # thesis .docx uploads

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;       # SSE progress stream must not be buffered
        proxy_read_timeout 3600s;  # a job can run for 15+ minutes
    }

    location /mcp {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;  # keep the port so links built by the tools work on localhost too
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;  # ngrok sets it; tools build links from it
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /s/ {
        proxy_pass http://backend:8000;  # share links: Open Graph tags, then a redirect into the SPA
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;  # SPA routes
    }
}
